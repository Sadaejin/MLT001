<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Language Interactive Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"
      <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="12" r="3" fill="currentColor" />
      </svg>
      <span>POLYGLOT.FX</span>
    </div>

    <nav class="controls">
      <button id="partyToggle" class="pill-btn" type="button">[ PARTY ]</button>
      <button id="themeToggle" class="pill-btn" type="button">[ LIGHT ]</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <canvas id="glCanvas"></canvas>
      <div class="hero-overlay">
        <p class="eyebrow">HTML5 &bull; CSS3 &bull; JS &bull; GLSL &bull; SVG &bull; JSON</p>
        <h1>Crafting Light in Code.</h1>
        <p class="subtitle">
          Zero-dependency static architecture powered by a live GPU fragment shader and dynamic JSON modules.
        </p>
        <div class="status-bar" id="statusBar">Initializing runtime...</div>
      </div>
    </section>

    <section class="modules">
      <div class="section-head">
        <span>01 / LANGUAGE ARCHITECTURE</span>
      </div>
      <div class="grid" id="cardsGrid"></div>
    </section>
  </main>

  <footer class="footer">
    <span>STATIC BUILD &mdash; READY FOR GITHUB PAGES</span>
    <span id="clock"></span>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
